<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Administración - Aura Girls</title>

    <link rel="stylesheet" href="inicio.css">

</head>


<body>


    <main class="admin-inicio">


        <h1>
            Aura Girls
        </h1>


        <h2>
            Panel de administración
        </h2>


        <p class="subtitulo">
            ¿Qué deseas administrar?
        </p>



        <section class="opciones-admin">


            <!-- PRODUCTOS -->

            <a
                href="panel-admin.html"
                class="opcion-admin"
            >

                <div class="icono-admin">
                    📦
                </div>

                <h3>
                    Administrar productos
                </h3>

                <p>
                    Agregar, modificar, eliminar
                    productos y cambiar su disponibilidad.
                </p>

            </a>



            <!-- PEDIDOS -->

            <a
                href="pedidos.html"
                class="opcion-admin"
            >

                <div class="icono-admin">
                    🛒
                </div>

                <h3>
                    Ver pedidos
                </h3>

                <p>
                    Consultar todos los pedidos
                    realizados desde la página.
                </p>

            </a>


        </section>


    </main>


<script src="admin-inicio.js"></script>

</body>
</html>
