    <!-- ENCABEZADO -->

        <div class="logo">

            <h1>Aura Girls</h1>

        <nav>

            <a href="index.html">Inicio</a>

            <a href="envios.html">Envíos</a>

        </nav>

    </header>


    <!-- CONTENIDO PRINCIPAL -->

    <main>

        <section class="comentarios">

            <h2>Comentarios</h2>

            <p>
                Compartí tu experiencia en Aura Girls.
            </p>


            <!-- FORMULARIO -->

            <div class="formulario-comentario">

                <h3>Dejanos tu opinión</h3>


                <form id="formulario-comentario">


                    <label for="nombre-comentario">

                        Nombre:

                    </label>


                    <input
                        type="text"
                        id="nombre-comentario"
                        required
                    >


                    <label for="calificacion">

                        Calificación:

                    </label>


                    <select
                        id="calificacion"
                        required
                    >

                        <option value="">

                            Seleccioná una calificación

                        </option>

                        <option value="5">

                            ⭐⭐⭐⭐⭐ Excelente

                        </option>

                        <option value="4">

                            ⭐⭐⭐⭐ Muy bueno

                        </option>

                        <option value="3">

                            ⭐⭐⭐ Bueno

                        </option>

                        <option value="2">

                            ⭐⭐ Regular

                        </option>

                        <option value="1">

                            ⭐ Malo

                        </option>

                    </select>


                    <label for="texto-comentario">

                        Comentario:

                    </label>


                    <textarea
                        id="texto-comentario"
                        required
                    ></textarea>


                    <button
                        type="submit"
                        class="boton-comentario"
                    >

                        Publicar comentario

                    </button>

                </form>

            </div>


            <!-- COMENTARIOS PUBLICADOS -->

            <div class="comentarios-publicados">

                <h3>Opiniones de nuestros clientes</h3>


                <div id="lista-comentarios">

                    <p>
                        Todavía no hay comentarios publicados.
                    </p>

                </div>

            </div>

        </section>

    </main>
